name: Local acceptance script validation

on:
  pull_request:
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'integration_test/**'
      - 'test/fixtures/synthetic-high-res-avd.jpg'
      - 'lib/test_harness.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/workflows/local-acceptance-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'integration_test/**'
      - 'test/fixtures/synthetic-high-res-avd.jpg'
      - 'lib/test_harness.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/workflows/local-acceptance-scripts.yml'

permissions:
  contents: read

jobs:
  validate-acceptance-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and analyze probes
        run: |
          dart format --output=none --set-exit-if-changed tool/acceptance test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart
          flutter analyze
      - name: Test acceptance probes
        run: flutter test test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart

  validate-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell acceptance files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            './tools/local_acceptance/Invoke-PrivacyStampHighResolutionAcceptance.ps1',
            './tools/local_acceptance/PrivacyStampAcceptanceEvidence.psm1',
            './tools/local_acceptance/Test-PrivacyStampAcceptanceEvidence.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
          }
      - name: Test evidence helpers
        shell: pwsh
        run: ./tools/local_acceptance/Test-PrivacyStampAcceptanceEvidence.ps1

  android-low-memory-acceptance:
    name: Android synthetic high-resolution low-memory acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Run synthetic acceptance on low-memory API 35 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          cores: 2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: flutter test -d emulator-5554 integration_test/synthetic_low_memory_acceptance_test.dart -r expanded
