name: Local acceptance script validation

on:
  pull_request:
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'integration_test/**'
      - 'test/fixtures/synthetic-high-res-avd.jpg'
      - 'lib/test_harness.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/scripts/run-low-memory-acceptance.sh'
      - '.github/workflows/local-acceptance-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'integration_test/**'
      - 'test/fixtures/synthetic-high-res-avd.jpg'
      - 'lib/test_harness.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/scripts/run-low-memory-acceptance.sh'
      - '.github/workflows/local-acceptance-scripts.yml'

permissions:
  contents: read

jobs:
  validate-acceptance-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and analyze probes
        run: |
          dart format --output=none --set-exit-if-changed tool/acceptance test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart
          flutter analyze
      - name: Test acceptance probes
        run: flutter test test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart

  validate-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell acceptance files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            './tools/local_acceptance/Invoke-PrivacyStampHighResolutionAcceptance.ps1',
            './tools/local_acceptance/PrivacyStampAcceptanceEvidence.psm1',
            './tools/local_acceptance/Test-PrivacyStampAcceptanceEvidence.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
          }
      - name: Test evidence helpers
        shell: pwsh
        run: ./tools/local_acceptance/Test-PrivacyStampAcceptanceEvidence.ps1

  android-low-memory-acceptance:
    name: Android synthetic high-resolution low-memory acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free runner disk for API 35 AVD
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Prepare Android diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p .ci-logs/android
          printf 'Android acceptance started at %s\n' "$(date --iso-8601=seconds)" | tee .ci-logs/android/progress.log
          printf 'Runner: %s\n' "${RUNNER_NAME:-unknown}" | tee -a .ci-logs/android/progress.log
          df -h / | tee .ci-logs/android/disk-before-avd.txt

      - name: Run synthetic acceptance on low-memory API 35 AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # This gate exercises Flutter/image behavior only; it does not use
          # Play services. The default image preserves API 35/x86_64 behavior
          # without the larger Google APIs image.
          target: default
          arch: x86_64
          profile: pixel_2
          # The fixture/export path needs very little guest storage. Keep the
          # data partition compact so the hosted runner can create the AVD;
          # RAM remains the acceptance constraint under test.
          disk-size: 2048M
          ram-size: 1536M
          heap-size: 256M
          cores: 2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/run-low-memory-acceptance.sh

      - name: Collect Android diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p .ci-logs/android
          printf 'Collecting Android diagnostics at %s\n' "$(date --iso-8601=seconds)" | tee -a .ci-logs/android/progress.log
          df -h / > .ci-logs/android/disk-after-avd.txt 2>&1
          collect_with_timeout() {
            local output="$1"
            shift
            printf 'Collecting %s at %s\n' "$output" "$(date --iso-8601=seconds)" | tee -a .ci-logs/android/progress.log
            timeout --signal=TERM --kill-after=5s 30s "$@" > "$output" 2>&1
            local status=$?
            printf 'Collected %s with exit %s at %s\n' "$output" "$status" "$(date --iso-8601=seconds)" | tee -a .ci-logs/android/progress.log
            return 0
          }
          collect_with_timeout .ci-logs/android/adb-devices.txt adb devices -l
          collect_with_timeout .ci-logs/android/getprop.txt adb shell getprop
          collect_with_timeout .ci-logs/android/proc-meminfo.txt adb shell cat /proc/meminfo
          collect_with_timeout .ci-logs/android/dumpsys-meminfo.txt adb shell dumpsys meminfo
          collect_with_timeout .ci-logs/android/logcat.txt adb logcat -d -v threadtime
          printf 'Diagnostics collection ended at %s.\n' "$(date --iso-8601=seconds)" | tee -a .ci-logs/android/progress.log

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-low-memory-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .ci-logs/android/
