name: Local acceptance script validation

on:
  pull_request:
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/workflows/local-acceptance-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/acceptance/**'
      - 'tools/local_acceptance/**'
      - 'test/image_metadata_probe_test.dart'
      - 'test/android_runtime_evidence_test.dart'
      - 'docs/high-resolution-acceptance.md'
      - '.github/workflows/local-acceptance-scripts.yml'

permissions:
  contents: read

jobs:
  validate-acceptance-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show formatter diff
        run: |
          dart format tool/acceptance test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart
          git diff -- tool/acceptance/android_runtime_evidence.dart
          git diff --exit-code -- tool/acceptance/android_runtime_evidence.dart
      - name: Analyze probes
        run: flutter analyze
      - name: Test acceptance probes
        run: flutter test test/image_metadata_probe_test.dart test/android_runtime_evidence_test.dart

  parse-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse high-resolution acceptance runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./tools/local_acceptance/Invoke-PrivacyStampHighResolutionAcceptance.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
