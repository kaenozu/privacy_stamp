name: Format issue17 files

on:
  push:
    branches:
      - agent/17-synthetic-low-memory-acceptance-v2
    paths:
      - '.github/workflows/format-issue17.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-synthetic-low-memory-acceptance-v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/main.dart integration_test/synthetic_low_memory_acceptance_test.dart
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart integration_test/synthetic_low_memory_acceptance_test.dart
          git rm .github/workflows/format-issue17.yml
          git commit -m 'style: format issue17 acceptance changes'
          git push origin HEAD:agent/17-synthetic-low-memory-acceptance-v2
