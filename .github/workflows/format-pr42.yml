name: Format PR42 main

on:
  push:
    branches:
      - agent/17-synthetic-low-memory-acceptance-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-synthetic-low-memory-acceptance-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply canonical formatter and remove helper
        run: |
          dart format lib/main.dart
          rm .github/workflows/format-pr42.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format main with CI Dart'
          git push origin HEAD:agent/17-synthetic-low-memory-acceptance-v2
