name: Format image probe once

on:
  pull_request:
    paths:
      - '.github/workflows/format-image-probe-once.yml'

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/self-contained-image-acceptance-20260805
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format probe and remove one-shot workflow
        run: |
          dart format tool/acceptance test/image_metadata_probe_test.dart
          rm .github/workflows/format-image-probe-once.yml
      - name: Commit formatted probe
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format image metadata probe'
          git push origin HEAD:agent/self-contained-image-acceptance-20260805
