name: Apply formatted image failure fix

on:
  push:
    branches:
      - agent/1-pick-image-error-ui-20260804

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CONTROLLER_GZ_B64: 
      TEST_GZ_B64: 
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply formatter output and restore CI workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CONTROLLER_GZ_B64" | base64 --decode | gzip --decompress > lib/features/redaction/presentation/stamp_controller.dart
          printf '%s' "$TEST_GZ_B64" | base64 --decode | gzip --decompress > test/pick_image_failure_test.dart
          git show caeace012cbc4a5c6dd79efd758d050c4ae7738b:.github/workflows/flutter-quality.yml > .github/workflows/flutter-quality.yml
          rm .github/workflows/apply-pick-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/redaction/presentation/stamp_controller.dart test/pick_image_failure_test.dart .github/workflows/flutter-quality.yml .github/workflows/apply-pick-format.yml
          git commit -m 'style: apply verified Dart formatting'
          git push origin HEAD:agent/1-pick-image-error-ui-20260804
