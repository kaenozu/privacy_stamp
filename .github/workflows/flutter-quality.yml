name: Flutter quality gates

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/3-lightweight-inspection-editor-decode-20260805
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply implementation
        run: python3 .github/agent-apply-3.py

      - name: Verify changes
        shell: bash
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          dart format .
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test
          flutter build web --release
          flutter build apk --debug
          flutter build apk --release
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: avoid duplicate high-resolution image decoding [agent-applied]'
          git push origin HEAD:agent/3-lightweight-inspection-editor-decode-20260805
