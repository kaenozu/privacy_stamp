name: Flutter quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Flutter quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run quality gates
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ci-logs
          : > .ci-logs/gates.tsv
          overall_status=0

          run_gate() {
            local name="$1"
            shift
            local log=".ci-logs/${name}.log"
            local command_text="$*"

            echo "::group::${name}"
            echo "Running: ${command_text}"
            "$@" 2>&1 | tee "${log}"
            local gate_status=${PIPESTATUS[0]}
            echo "Exit code: ${gate_status}"
            echo "::endgroup::"
            printf '%s\t%s\t%s\n' "${name}" "${gate_status}" "${command_text}" >> .ci-logs/gates.tsv

            if [ "${gate_status}" -ne 0 ]; then
              echo "::error file=${log}::Command failed (exit ${gate_status}): ${command_text}"
              overall_status=1
            fi
          }

          run_gate tool_versions bash -c 'flutter --version && dart --version && java -version'
          run_gate pub_get flutter pub get
          run_gate format dart format --output=none --set-exit-if-changed .
          run_gate analyze flutter analyze --fatal-infos
          run_gate test flutter test --reporter json
          run_gate web_build flutter build web --release
          run_gate android_debug_build flutter build apk --debug
          run_gate android_release_smoke flutter build apk --release

          passed=$(awk -F '\t' '$2 == 0 { count++ } END { print count + 0 }' .ci-logs/gates.tsv)
          failed=$(awk -F '\t' '$2 != 0 { count++ } END { print count + 0 }' .ci-logs/gates.tsv)
          warnings=$(grep -Eic '(^|[[:space:]])(warning|info)([[:space:]:]|$)' .ci-logs/analyze.log 2>/dev/null || true)

          if command -v jq >/dev/null 2>&1; then
            # `flutter test --reporter json` can emit dependency-resolution text
            # before the JSON protocol starts. Normalize the log into valid JSONL
            # first so reporting cannot turn otherwise-passing gates red.
            jq -Rrc 'fromjson? // empty' .ci-logs/test.log > .ci-logs/test-events.jsonl || true

            test_count=$(
              jq -r 'select(.type == "testDone" and (.hidden // false) == false) | .testID' \
                .ci-logs/test-events.jsonl 2>/dev/null \
                | sort -u \
                | wc -l \
                | tr -d ' '
            ) || test_count="unavailable"
            skipped_count=$(
              jq -r 'select(.type == "testDone" and (.hidden // false) == false and ((.skipped // false) == true or .result == "skipped")) | .testID' \
                .ci-logs/test-events.jsonl 2>/dev/null \
                | sort -u \
                | wc -l \
                | tr -d ' '
            ) || skipped_count="unavailable"
            failed_test_count=$(
              jq -r 'select(.type == "testDone" and (.hidden // false) == false and .result == "failure") | .testID' \
                .ci-logs/test-events.jsonl 2>/dev/null \
                | sort -u \
                | wc -l \
                | tr -d ' '
            ) || failed_test_count="unavailable"
          else
            test_count="unavailable (jq not installed)"
            skipped_count="unavailable (jq not installed)"
            failed_test_count="unavailable (jq not installed)"
          fi

          {
            echo "## Flutter quality gates"
            echo
            echo "| Metric | Result |"
            echo "| --- | ---: |"
            echo "| Gates passed | ${passed} |"
            echo "| Gates failed | ${failed} |"
            echo "| Tests completed | ${test_count} |"
            echo "| Tests skipped | ${skipped_count} |"
            echo "| Tests failed | ${failed_test_count} |"
            echo "| Analyzer warning/info lines | ${warnings} |"
            echo
            echo "Artifacts: CI logs, Web build, debug APK, and a release smoke APK are uploaded when available."
            echo "The release smoke APK uses the repository's current debug signing configuration and provisional application ID; it is not a distributable release."
            echo
            echo "### Gate results"
            awk -F '\t' '{ icon = ($2 == 0 ? "PASS" : "FAIL"); printf "- `%s`: %s (exit %s)\n", $1, $2 }' .ci-logs/gates.tsv
            if [ "${failed}" -gt 0 ]; then
              echo
              echo "### Failed commands"
              awk -F '\t' '$2 != 0 { printf "- `%s` (exit %s): `%s`\n", $1, $2, $3 }' .ci-logs/gates.tsv
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${overall_status}"

      - name: Upload CI logs and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-quality-gates-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .ci-logs/
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            lib/features/redaction/presentation/stamp_controller.dart
            test/pick_image_failure_test.dart
