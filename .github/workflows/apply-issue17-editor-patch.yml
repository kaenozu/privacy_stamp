name: Apply issue17 editor patch

on:
  push:
    branches:
      - agent/17-synthetic-low-memory-acceptance-v2
    paths:
      - '.github/scripts/patch_issue17_interactive.py'
      - '.github/workflows/apply-issue17-editor-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/17-synthetic-low-memory-acceptance-v2
      - run: python3 .github/scripts/patch_issue17_interactive.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/main.dart
      - name: Commit production patch and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git rm .github/scripts/patch_issue17_interactive.py .github/workflows/apply-issue17-editor-patch.yml
          git commit -m 'feat: support pan and zoom in high-resolution editor'
          git push origin HEAD:agent/17-synthetic-low-memory-acceptance-v2
